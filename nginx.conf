server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(png|jpe?g|gif|svg|webp|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
